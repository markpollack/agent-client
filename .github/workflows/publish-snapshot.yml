name: Publish Snapshot

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    uses: markpollack/build-tools/.github/workflows/publish-snapshot.yml@76a0c8c0d223b62e49619c45e0c0a7b15e1bf3cc
    with:
      java-version: '21'
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
