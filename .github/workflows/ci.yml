name: CI Build

on:
  push:
    branches: [main]
    # Point-release tags run the same build plus the published-consumer gate below.
    # GitHub does not evaluate paths filters for tag pushes.
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No agent CLI is installed and no provider credential is passed here: the
      # credentialed Claude/Gemini smoke tests self-skip without their keys and run
      # only through the dispatch-only Credentialed Smoke workflow (smoke.yml).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: ./mvnw clean verify -B
      # The published-consumer gate applies to point releases only (tag pushes v*).
      # Development snapshots on main keep the normal verification above; the gate
      # itself is unchanged.
      - name: Verify published no-BOM consumers (point releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/published-consumer-gate.py
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7
