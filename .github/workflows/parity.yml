# Provider Parity Matrix
# Runs ProviderParityTCK scenarios across Claude, Codex, Gemini, and Junie
# to catch behavioral parity regressions (e.g., Codex skipGitCheck issue)
#
# The weekly scheduled run doubles as the latest-CLI drift canary: the CLIs are
# installed at their latest published versions, so upstream changes (new flags,
# payload fields, behavior shifts) surface here before they bite users.

name: Provider Parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'agent-models/**'
      - 'provider-sdks/**'
      - 'agent-client-core/**'
  push:
    branches: [main]
    paths:
      - 'agent-models/**'
      - 'provider-sdks/**'
      - 'agent-client-core/**'
      # Re-run when the harness changes: credential/CLI wiring determines
      # which providers have live evidence.
      - '.github/workflows/parity.yml'
  schedule:
    - cron: '0 7 * * 1'  # Weekly Mondays
  workflow_dispatch:

concurrency:
  group: parity-${{ github.ref }}
  # Let in-flight runs finish: the live-agent suite takes minutes, and a push
  # burst (e.g. release + snapshot bump) would otherwise cancel every run before
  # it reports. The drift canary is only useful if it actually completes.
  cancel-in-progress: false

jobs:
  parity:
    # Only run in the upstream repo (forks won't have secrets)
    if: github.repository_owner == 'markpollack'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      # Grok and Antigravity are absent for one reason only: neither CLI can authenticate
      # here. Both suites exist and both pass 10/10 with zero skips against live CLIs, the
      # same ten scenarios the rows below run — the gap is the runner, not the
      # provider. They sign in interactively and cache credentials under ~/.grok and
      # ~/.gemini/antigravity-cli; neither reads an API key from the environment, so there
      # is no secret to hand a matrix row, so that row would be skipped. Wiring them up
      # needs a self-hosted runner with those credentials, or non-interactive vendor auth.
      matrix:
        provider:
          - name: claude
            module: agent-models/agent-claude
            test-class: ClaudeProviderParityIT
            report: agent-models/agent-claude/target/surefire-reports/TEST-io.github.markpollack.agents.claude.ClaudeProviderParityIT.xml
            cli-install: npm install -g @anthropic-ai/claude-code
            secret-env: ANTHROPIC_API_KEY
          - name: codex
            module: agent-models/agent-codex
            test-class: CodexProviderParityIT
            report: agent-models/agent-codex/target/surefire-reports/TEST-io.github.markpollack.agents.codex.CodexProviderParityIT.xml
            cli-install: npm install -g @openai/codex
            secret-env: OPENAI_API_KEY
          - name: gemini
            module: agent-models/agent-gemini
            test-class: GeminiProviderParityIT
            report: agent-models/agent-gemini/target/surefire-reports/TEST-io.github.markpollack.agents.gemini.GeminiProviderParityIT.xml
            cli-install: npm install -g @google/gemini-cli
            secret-env: GEMINI_API_KEY
          - name: junie
            module: agent-models/agent-junie
            test-class: JunieProviderParityIT
            report: agent-models/agent-junie/target/surefire-reports/TEST-io.github.markpollack.agents.junie.JunieProviderParityIT.xml
            cli-install: curl -fsSL https://junie.jetbrains.com/install.sh | bash && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            secret-env: JUNIE_API_KEY

    name: Parity - ${{ matrix.provider.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Check provider credentials
        id: credentials
        env:
          PROVIDER_KEY: ${{ secrets[matrix.provider.secret-env] }}
          PROVIDER_NAME: ${{ matrix.provider.name }}
          SECRET_NAME: ${{ matrix.provider.secret-env }}
        run: |
          if [ -z "$PROVIDER_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping parity for $PROVIDER_NAME: $SECRET_NAME is not configured."
            echo "**$PROVIDER_NAME: SKIPPED** — $SECRET_NAME is not configured; no live parity qualification." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install CLI
        if: steps.credentials.outputs.available == 'true'
        run: ${{ matrix.provider.cli-install }}

      - name: Run parity tests
        if: steps.credentials.outputs.available == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # `codex exec` does not use OPENAI_API_KEY as its bearer credential; the
          # env var it reads is CODEX_API_KEY. OPENAI_API_KEY stays because
          # CodexProviderParityIT gates on it, but without this line Codex reaches
          # the Responses API unauthenticated and every behavioral scenario 401s.
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Junie reads its own credential from the environment rather than from an
          # interactively cached login, which is the whole reason it can have a row here.
          JUNIE_API_KEY: ${{ secrets.JUNIE_API_KEY }}
        run: |
          ./mvnw test \
            -pl ${{ matrix.provider.module }} -am \
            -Dtest="${{ matrix.provider.test-class }}" \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -B --no-transfer-progress

      - name: Verify parity test counts
        if: steps.credentials.outputs.available == 'true'
        run: python3 scripts/check-provider-parity-report.py "${{ matrix.provider.report }}"

      - name: Upload surefire reports
        if: always() && steps.credentials.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.provider.name }}
          path: ${{ matrix.provider.module }}/target/surefire-reports/
          if-no-files-found: ignore

  summary:
    needs: parity
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Parity Summary
        run: |
          echo "## Provider Parity Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Overall: **${{ needs.parity.result }}** — providers without CI credentials are skipped, not qualified. See each provider's summary and test steps for execution status; executed suites attach surefire reports as artifacts." >> "$GITHUB_STEP_SUMMARY"
