# Provider Parity Matrix
# Runs ProviderParityTCK scenarios across Claude, Codex, and Gemini
# to catch behavioral parity regressions (e.g., Codex skipGitCheck issue)
#
# The weekly scheduled run doubles as the latest-CLI drift canary: the CLIs are
# installed at their latest published versions, so upstream changes (new flags,
# payload fields, behavior shifts) surface here before they bite users.

name: Provider Parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'agent-models/**'
      - 'provider-sdks/**'
      - 'agent-client-core/**'
  push:
    branches: [main]
    paths:
      - 'agent-models/**'
      - 'provider-sdks/**'
      - 'agent-client-core/**'
  schedule:
    - cron: '0 7 * * 1'  # Weekly Mondays, after the agents-runtime image rebuild (06:00)
  workflow_dispatch:

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    # Only run in the upstream repo (forks won't have secrets)
    if: github.repository_owner == 'markpollack'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        provider:
          - name: claude
            module: agent-models/agent-claude
            test-class: ClaudeProviderParityIT
            cli-install: npm install -g @anthropic-ai/claude-code
            secret-env: ANTHROPIC_API_KEY
          - name: codex
            module: agent-models/agent-codex
            test-class: CodexProviderParityIT
            cli-install: npm install -g @openai/codex
            secret-env: OPENAI_API_KEY
          - name: gemini
            module: agent-models/agent-gemini
            test-class: GeminiProviderParityIT
            cli-install: npm install -g @google/gemini-cli
            secret-env: GEMINI_API_KEY

    name: Parity - ${{ matrix.provider.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify API key secret is configured
        env:
          PROVIDER_KEY: ${{ secrets[matrix.provider.secret-env] }}
        run: |
          if [ -z "$PROVIDER_KEY" ]; then
            echo "::error::Repository secret ${{ matrix.provider.secret-env }} is not configured — parity for ${{ matrix.provider.name }} cannot authenticate. This is a configuration gap, not a code regression."
            exit 1
          fi

      - name: Install CLI
        run: ${{ matrix.provider.cli-install }}

      - name: Run parity tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ./mvnw test \
            -pl ${{ matrix.provider.module }} -am \
            -Dtest="${{ matrix.provider.test-class }}" \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -B --no-transfer-progress

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.provider.name }}
          path: ${{ matrix.provider.module }}/target/surefire-reports/
          if-no-files-found: ignore

  summary:
    needs: parity
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Parity Summary
        run: |
          echo "## Provider Parity Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Overall: **${{ needs.parity.result }}** — per-provider pass/fail is on the matrix jobs; surefire reports are attached as artifacts." >> "$GITHUB_STEP_SUMMARY"
